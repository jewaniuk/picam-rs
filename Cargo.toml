[workspace]
members = ["xtask"]

[package]
name = "picam-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A safe Rust wrapper around the Teledyne Princeton Instruments PICam camera API"
repository = "https://github.com/jewaniuk/picam-rs"
readme = "README.md"
keywords = ["picam", "teledyne", "camera", "scientific-camera", "ffi"]
categories = ["api-bindings", "hardware-support", "science"]
exclude = [".claude/", ".github/", "CLAUDE.md", "CONTRIBUTING.md", "reference/", "vendor/"]

[dependencies]
bitflags = "2.13.2"
thiserror = "2.0.20"
tracing = "0.1.44"
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory"] }

[package.metadata.docs.rs]
# the bindings were generated for this target, and their layout checks need
# its type sizes
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
missing_errors_doc = "warn"
